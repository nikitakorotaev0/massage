<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Контакты — Дзен</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div id="header"></div>




<main class="section">


<div class="container">



<h1 class="page-title">
Контакты
</h1>




<div class="cards">



<div class="card">

<h3>
Адрес
</h3>

<p id="contactAddress">
г. Арти<br>
ул. Восточная, 15
</p>

</div>




<div class="card">

<h3>
Телефон
</h3>

<p id="contactPhone">
+7 (900) 000-00-00
</p>

</div>




<div class="card">

<h3>
Email
</h3>

<p id="contactEmail">
info@dzen.ru
</p>

</div>




<div class="card">

<h3>
Режим работы
</h3>

<p id="contactHours">
Пн–Сб: 10:00–20:00<br>
Вс: выходной
</p>

</div>



</div>






<div class="card" style="margin-top:30px;">


<h2>
Запись на массаж
</h2>



<p>
Хотите посетить наш салон?
Оставьте заявку, и мы свяжемся с вами.
</p>




<a class="btn" href="client/booking.html">
Записаться
</a>



</div>



</div>


</main>





<div id="footer"></div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/components.js"></script>

<script src="js/ui.js"></script>

<script src="js/script.js"></script>

<script>
(async function(){
  const settings = await fetchSalonSettings();

  if(settings.address){
    document.getElementById("contactAddress").textContent = settings.address;
  }
  if(settings.contact_phone){
    document.getElementById("contactPhone").textContent = settings.contact_phone;
  }
  if(settings.contact_email){
    document.getElementById("contactEmail").textContent = settings.contact_email;
  }
  if(settings.work_start && settings.work_end){
    const daysText = formatWorkDays(settings.work_days);
    document.getElementById("contactHours").innerHTML =
      `${daysText}: ${settings.work_start.slice(0,5)}–${settings.work_end.slice(0,5)}`;
  }
})();
</script>


</body>

</html>
