<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Комментарии — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div id="header"></div>


<main class="section">


<div class="container">


<h1 class="page-title">
Внутренние комментарии
</h1>

<p style="margin-bottom:20px;">
<a class="btn" href="dashboard.html">Кабинет</a>
<a class="btn" href="clients.html" style="margin-left:10px;">Клиенты</a>
</p>


<div class="card">

<h2>
Добавить комментарий
</h2>

<label>
Клиент
</label>

<form onsubmit="return false;">
<input type="text" id="commentClientSearchInput" placeholder="Введите имя, фамилию или телефон">
</form>

<button class="btn" type="button" id="commentClientSearchBtn" style="margin-top:10px;">
Найти
</button>

<div id="commentClientResults"></div>


<div id="commentFormBox" style="display:none; margin-top:20px;">

<p>
Клиент: <strong id="commentFormClientName"></strong>
</p>

<form onsubmit="return false;">
<label style="margin-top:10px;">
Комментарий
</label>

<textarea id="commentText" rows="5" placeholder="Напишите заметку для сотрудников"></textarea>
</form>

<button class="btn" type="button" id="saveCommentBtn" style="margin-top:15px;">
Сохранить
</button>

</div>

</div>


<h2 style="margin-top:30px;">
Последние комментарии
</h2>

<div id="commentsFeedContainer" style="margin-top:15px;">
<p>Загрузка...</p>
</div>


</div>


</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/script.js"></script>
<script src="../js/employee.js"></script>

<script>
initEmployeeComments();
</script>


</body>

</html>
