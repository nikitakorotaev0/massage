<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Медицинская информация — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div id="header"></div>


<main class="section">


<div class="container">


<h1 class="page-title">
Медицинская информация
</h1>


<div class="card form-card">


<form onsubmit="return false;">


<label>
Противопоказания, операции, травмы, аллергии
</label>

<textarea id="contraindications" rows="5" placeholder="Например: аллергия на эфирные масла, травма спины в 2022 году..."></textarea>


<label style="margin-top:15px;">
Заметки для мастера
</label>

<textarea id="notes" rows="5" placeholder="Пожелания, особенности процедур..."></textarea>


<button class="btn" type="button" id="saveMedicalBtn" style="margin-top:15px;">
Сохранить изменения
</button>


</form>


</div>


</div>


</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/script.js"></script>
<script src="../js/profile.js"></script>

<script>
initEditMedical();
</script>


</body>

</html>
