<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Запись на массаж — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div id="header"></div>


<main class="section">


<div class="container">


<h1 class="page-title">
Запись на массаж
</h1>


<div class="card form-card">


<form onsubmit="return false;">


<h2>
Кого записываем?
</h2>

<label>
<input type="radio" id="personSelf" name="person" checked>
Меня
</label>

<label>
<input type="radio" id="personOther" name="person">
Другого человека
</label>


<div id="otherPersonFields" style="display:none; flex-direction:column; gap:10px; margin-top:15px;">

<label>ФИО посетителя</label>
<input type="text" id="otherName" placeholder="Введите ФИО">

<label>Телефон посетителя</label>
<input type="tel" id="otherPhone" placeholder="+7 (900) 000-00-00">

</div>


<h2 style="margin-top:30px;">
Выберите услугу
</h2>

<select id="serviceSelect">
<option>Загрузка...</option>
</select>


<h2 style="margin-top:30px;">
Выберите мастера
</h2>

<select id="employeeSelect">
<option>Загрузка...</option>
</select>


<h2 style="margin-top:30px;">
Дата посещения
</h2>

<input type="date" id="dateInput">


<h2 style="margin-top:30px;">
Свободное время
</h2>

<div id="slotsContainer" class="slots-container">
<p>Выберите услугу, мастера и дату</p>
</div>


<div id="bookingMessage" class="booking-message" style="display:none;"></div>


<button class="btn" type="button" id="submitBookingBtn" style="margin-top:20px;">
Подтвердить запись
</button>


</form>


</div>


</div>


</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/script.js"></script>
<script src="../js/booking.js"></script>


</body>

</html>
