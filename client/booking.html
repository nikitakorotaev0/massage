<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Запись на массаж — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div id="header"></div>


<main class="section">


<div class="container">


<h1 class="page-title">
Запись на массаж
</h1>


<div id="bookingAlert" class="booking-alert" style="display:none;"></div>


<div class="card form-card">


<form onsubmit="return false;">


<h2>
Кого записываем?
</h2>

<label>
<input type="radio" id="personSelf" name="person" checked>
Меня
</label>

<label>
<input type="radio" id="personOther" name="person">
Другого человека
</label>


<div id="otherPersonFields" style="display:none; flex-direction:column; gap:10px; margin-top:15px;">

<label>ФИО посетителя</label>
<input type="text" id="otherName" placeholder="Введите ФИО">

<label>Телефон посетителя</label>
<input type="tel" id="otherPhone" placeholder="+7 (900) 000-00-00">

</div>


<h2 style="margin-top:30px;">
Выберите услугу
</h2>

<select id="serviceSelect">
<option>Загрузка...</option>
</select>

<div id="additionalServicesContainer"></div>

<button class="btn" type="button" id="addServiceBtn" style="margin-top:10px;">
+ Добавить услугу
</button>


<h2 style="margin-top:30px;">
Дата посещения
</h2>

<input type="date" id="dateInput">

<p id="masterInfo" class="booking-message" style="display:none;"></p>


<h2 style="margin-top:30px;">
Свободное время
</h2>

<div id="slotsContainer" class="slots-container">
<p>Выберите услугу и дату</p>
</div>


<h2 style="margin-top:30px;">
Промокод
</h2>

<div id="promoSection">
<div style="display:flex; gap:10px; flex-wrap:wrap;">
<input type="text" id="promoCodeInput" placeholder="Введите промокод" style="flex:1; min-width:180px; text-transform:uppercase;">
<button class="btn" type="button" id="applyPromoBtn">Применить</button>
</div>
</div>

<p id="promoUnavailableNote" class="booking-message" style="display:none;">
Промокод недоступен при записи на несколько услуг.
</p>

<p id="promoMessage" class="booking-message" style="display:none;"></p>

<p id="priceInfo" class="booking-message" style="display:none;"></p>


<label style="font-weight:normal; margin-top:20px; display:flex; align-items:flex-start; gap:8px;">
<input type="checkbox" id="consentCheckbox" style="margin-top:4px;">
<span>Ознакомлен(а) и согласен(на) на <a href="../terms.html" target="_blank">оказание услуг</a></span>
</label>


<button class="btn" type="button" id="submitBookingBtn" style="margin-top:20px;">
Подтвердить запись
</button>


</form>


</div>


</div>


</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/script.js"></script>
<script src="../js/booking.js"></script>


</body>

</html>
