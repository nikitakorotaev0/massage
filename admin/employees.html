<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Сотрудники — Админ-панель — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>


<div id="header"></div>


<main class="section">

<div class="container">


<h1 class="page-title">
Сотрудники
</h1>

<p style="margin-bottom:20px;">
<a class="btn" href="dashboard.html">Панель</a>
<a class="btn" href="schedule.html" style="margin-left:10px;">Расписание</a>
</p>


<div class="card">

<h2>
Назначить сотрудником
</h2>

<p>
Сотрудником можно назначить только уже зарегистрированного клиента.
</p>

<label>Поиск клиента</label>
<form onsubmit="return false;">
<input type="text" id="candidateSearchInput" placeholder="Имя, фамилия или телефон">
</form>

<button class="btn" type="button" id="candidateSearchBtn" style="margin-top:10px;">
Найти
</button>

<div id="candidateResults"></div>


<div id="assignFormBox" style="display:none; margin-top:20px;">

<p>
Клиент: <strong id="assignFormName"></strong>
</p>

<form onsubmit="return false;">
<label>Должность</label>
<input type="text" id="newEmployeePosition" placeholder="Массажист">
</form>

<button class="btn" type="button" id="assignEmployeeBtn" style="margin-top:15px;">
Назначить сотрудником
</button>

</div>

</div>


<h2 style="margin-top:30px;">
Текущие сотрудники
</h2>

<div id="employeesListContainer" style="margin-top:15px;">
<p>Загрузка...</p>
</div>


</div>

</main>



<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/script.js"></script>
<script src="../js/admin.js"></script>

<script>
initAdminEmployees();
</script>


</body>

</html>
