<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Расписание сотрудников — Админ-панель — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>

<div id="header"></div>


<main class="section">

<div class="container">


<h1 class="page-title">
Расписание сотрудников
</h1>

<p style="margin-bottom:20px;">
<a class="btn" href="dashboard.html">Панель</a>
<a class="btn" href="clients.html" style="margin-left:10px;">Пользователи</a>
</p>


<div class="card">

<h2>
Назначить мастера на день
</h2>

<form onsubmit="return false;">

<label>Дата</label>
<input type="date" id="assignDate">

<label>Сотрудник</label>
<select id="assignEmployee">
<option>Загрузка...</option>
</select>

<button class="btn" type="button" id="assignBtn" style="margin-top:10px;">
Назначить
</button>

</form>

</div>


<div class="card" style="margin-top:25px;">

<h2>
Статистика за текущий месяц
</h2>

<div id="statsContainer">
<p>Загрузка...</p>
</div>

</div>


<div class="card" style="margin-top:25px;">

<h2>
Выходные и нерабочие дни
</h2>

<form onsubmit="return false;">

<label>Дата</label>
<input type="date" id="holidayDate">

<label style="margin-top:10px;">Причина (необязательно)</label>
<input type="text" id="holidayReason" placeholder="Например: санитарный день">

</form>

<button class="btn" type="button" id="addHolidayBtn" style="margin-top:15px;">
Добавить выходной
</button>

<div id="holidaysListContainer" style="margin-top:20px;">
<p>Загрузка...</p>
</div>

</div>


<h2 style="margin-top:30px;">
Ближайшие 5 недель
</h2>

<div id="scheduleContainer" style="margin-top:15px;">
<p>Загрузка...</p>
</div>


</div>

</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/script.js"></script>
<script src="../js/schedule.js"></script>

<script>
initAdminSchedule();
</script>

</body>

</html>
