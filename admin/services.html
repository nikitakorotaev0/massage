<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Услуги — Админ-панель — Дзен</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>

<div id="header"></div>


<main class="section">

<div class="container">


<h1 class="page-title">
Услуги
</h1>

<p style="margin-bottom:20px;">
<a class="btn" href="dashboard.html">Панель</a>
</p>


<div class="card">

<h2>
Добавить услугу
</h2>

<form onsubmit="return false;">

<label>Название</label>
<input type="text" id="newServiceName" placeholder="Классический массаж">

<label style="margin-top:10px;">Описание</label>
<textarea id="newServiceDesc" rows="3" placeholder="Краткое описание услуги"></textarea>

<label style="margin-top:10px;">Продолжительность (мин)</label>
<input type="number" id="newServiceDuration" placeholder="60">

<label style="margin-top:10px;">Цена (₽)</label>
<input type="number" id="newServicePrice" placeholder="2500">

</form>

<button class="btn" type="button" id="createServiceBtn" style="margin-top:15px;">
Создать услугу
</button>

</div>


<div id="servicesListContainer" style="margin-top:30px;">
<p>Загрузка...</p>
</div>


</div>

</main>


<div id="footer"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/components.js"></script>
<script src="../js/ui.js"></script>

<script src="../js/script.js"></script>
<script src="../js/admin-services.js"></script>

<script>
initAdminServices();
</script>

</body>

</html>
